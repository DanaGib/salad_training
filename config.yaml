model:
  # Options:
  #   salad_baseline          — standard SALAD, no depth branch
  #   salad_joint_depth       — SALAD + frozen teacher + AlignmentMLP (local loss only)
  #   salad_predictor_global  — local loss + SALAD applied to predictor output (global)
  #   salad_global_depth      — SALAD applied to depth features for a global depth loss
  #   salad_global_local_depth — global depth loss + local alignment loss
  type: "salad_baseline"

  backbone:
    arch: "dinov2_vitb14"
    num_trainable_blocks: 4
    return_token: true
    norm_layer: true

  aggregator:
    num_channels: 768
    num_clusters: 64
    cluster_dim: 128
    token_dim: 256

  # Alignment MLP — used when model.type requires a local distillation branch:
  #   salad_joint_depth, salad_predictor_global, salad_global_local_depth
  mlp:
    # Options: "token_by_token" | "linear"
    #   token_by_token : Linear -> ReLU -> Linear (uses hidden_dim)
    #   linear         : single Linear(input_dim, output_dim); hidden_dim ignored
    type: "token_by_token"
    input_dim: 768
    hidden_dim: 1024
    output_dim: 768
    # L2 normalisation applied inside the MLP.
    # "none"   : no normalisation; raw magnitudes passed to the loss
    # "before" : F.normalize applied to input patches before the projection
    # "after"  : F.normalize applied to projected output before the loss
    normalization: "none"

  teacher:
    name: "depth-anything/Depth-Anything-V2-Base-hf"

  # Optional: path to a Lightning .ckpt file whose aggregator.* weights are
  # loaded into the SALAD aggregator before training (Trial 4 / pretrained init).
  # Set to null to use random initialization (default).
  init_aggregator_from: null

loss:
  vpr_loss: "MultiSimilarityLoss"
  miner: "MultiSimilarityMiner"
  miner_margin: 0.1
  # Options: "mse" | "cosine"
  alignment_loss_type: "mse"
  # Weight of the local patch-alignment loss (salad_joint_depth, salad_predictor_global,
  # salad_global_local_depth). Formerly named "alpha".
  alpha_local: 0.2
  # Weight of the global depth MS loss (salad_predictor_global, salad_global_depth,
  # salad_global_local_depth).
  alpha_global: 0.1
  # If true, inserts a learnable nn.Linear(768,768) before passing depth features into
  # the SALAD head (salad_global_depth / salad_global_local_depth only).
  # Use when the global depth loss shows convergence trouble due to feature-space mismatch.
  use_linear_proj: false

training:
  batch_size: 60
  img_per_place: 4
  min_img_per_place: 4
  image_size: [224, 224]
  num_workers: 10
  max_epochs: 4
  lr: 6.0e-5
  optimizer: "adamw"
  weight_decay: 9.5e-9
  momentum: 0.9
  lr_sched: "linear"
  lr_sched_start_factor: 1.0
  lr_sched_end_factor: 0.2
  lr_sched_total_iters: 4000
  precision: "16-mixed"
  # Print + log to W&B every N iterations (running averages)
  log_interval: 1000
  val_set_names: ["pitts30k_val"]
  faiss_gpu: false
  # -1 = keep all epoch checkpoints; set to 3 to keep only the best 3 by R@1
  save_top_k: -1
  # Early stopping: stop when pitts30k_val/recall_at_1 does not improve by
  # min_delta=0.0005 for this many consecutive epochs. 0 = disabled.
  early_stop_patience: 0

wandb:
  project: "salad-vpr"
  entity: null   # set to your W&B username/team if needed
  run_name: null # auto-generated by W&B if null
